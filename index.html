<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاتورة - Loudy Store</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  body { background: linear-gradient(180deg, #ffeef5, #fdf0f6); padding: 16px; direction: rtl; }
  .container { max-width: 430px; margin: 0 auto; }

  .invoice {
    background: #fff; border-radius: 22px; overflow: hidden;
    box-shadow: 0 8px 30px rgba(214, 51, 132, .18);
    position: relative;
  }
  /* العلامة المائية */
  .watermark {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    pointer-events: none; z-index: 0;
  }
  .watermark img { width: 78%; max-width: 320px; opacity: .06; border-radius: 50%; }
  .invoice > *:not(.watermark) { position: relative; z-index: 1; }

  /* الهيدر المزخرف */
  .header {
    background: linear-gradient(160deg, #ff9ec7 0%, #ff65a3 45%, #d63384 100%);
    color: #fff; padding: 16px 16px 14px; text-align: center; position: relative; overflow: hidden;
  }
  .header::before, .header::after {
    content: ''; position: absolute; border-radius: 50%; background: rgba(255,255,255,.12);
  }
  .header::before { width: 130px; height: 130px; top: -50px; right: -40px; }
  .header::after { width: 90px; height: 90px; bottom: -40px; left: -20px; }
  .header img.logo {
    width: 64px; height: 64px; object-fit: cover; border-radius: 50%;
    border: 4px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,.25);
    position: relative; z-index: 1;
  }
  .header h1 { font-size: 21px; letter-spacing: .5px; margin-top: 8px; position: relative; z-index: 1; }
  .header p { margin-top: 3px; opacity: .95; font-size: 12.5px; position: relative; z-index: 1; }
  .sparkle { position: absolute; color: rgba(255,255,255,.55); font-size: 16px; z-index: 1; }

  .section { padding: 10px 16px 0; }
  .section-title {
    font-size: 13px; font-weight: 800; color: #a8275f; margin-bottom: 7px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-title::after { content: ''; flex: 1; height: 1.5px; background: linear-gradient(90deg, #ffc2d9, transparent); }
  .field { margin-bottom: 0; }
  .field label { display: block; font-size: 11.5px; color: #b34a78; margin-bottom: 3px; font-weight: 700; }
  .field input {
    width: 100%; padding: 8px 10px; border: 1.5px solid #f6c6da; border-radius: 10px;
    font-size: 14px; outline: none; transition: .2s; background: #fffafc; text-align: right;
  }
  .field input:focus { border-color: #ff65a3; box-shadow: 0 0 0 3px rgba(255,101,163,.14); }

  table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 4px; border-radius: 12px; overflow: hidden; }
  th, td { padding: 7px 4px; text-align: center; font-size: 12.5px; }
  th { background: linear-gradient(135deg, #ff7eb3, #d63384); color: #fff; font-size: 12px; }
  tr:nth-child(even) td { background: #fff3f8; }
  td input {
    width: 100%; padding: 7px 4px; border: 1px solid #f6c6da; border-radius: 8px;
    font-size: 13px; text-align: center; outline: none; background: #fffafc;
  }
  td input:focus { border-color: #ff65a3; }
  .item-total { font-weight: 800; color: #d63384; white-space: nowrap; }
  .del-btn { background: #ff8fab; color: #fff; border: none; border-radius: 8px; padding: 5px 9px; cursor: pointer; font-size: 13px; }
  .del-btn:hover { background: #e75480; }
  .add-btn {
    width: 100%; margin-top: 10px; background: linear-gradient(135deg, #ffc2d9, #ff65a3); color: #fff;
    border: none; border-radius: 11px; padding: 11px; cursor: pointer; font-size: 14px; font-weight: 800;
  }
  .add-btn:hover { opacity: .92; }

  /* الملخص ككارت أنيق */
  .summary {
    background: linear-gradient(160deg, #fff3f8, #ffe4ef);
    margin: 10px 14px 10px; border-radius: 16px; padding: 10px 14px;
    border: 1.5px solid #f8c3d9; box-shadow: inset 0 1px 0 #fff;
  }
  .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 13.5px; color: #7a2c4e; }
  .summary-row.grand {
    margin-top: 8px; padding: 10px 12px; border-radius: 12px;
    background: linear-gradient(135deg, #ff7eb3, #d63384); color: #fff;
    font-size: 16px; font-weight: 800; box-shadow: 0 4px 12px rgba(214,51,132,.3);
  }
  .summary-row.paid { font-weight: 700; color: #2fbf71; }
  .summary-row.remaining { font-size: 15px; font-weight: 800; color: #e75480; }
  .summary input.fee {
    width: 80px; padding: 5px; border: 1.5px solid #f6c6da; border-radius: 8px;
    text-align: center; font-size: 13px; outline: none; background: #fff;
  }
  .summary input.fee.paid-in {
    border-color: #2fbf71; color: #2fbf71; font-weight: 800;
  }

  .thanks { text-align: center; padding: 6px 16px 14px; }
  .thanks .line { width: 60px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, #ff9ec7, #d63384); margin: 0 auto 8px; }
  .thanks p { font-size: 14px; color: #b34a78; }
  .thanks span { font-weight: 800; color: #d63384; }

  .actions { text-align: center; padding: 4px 0 24px; display: flex; gap: 10px; justify-content: center; }
  .btn { padding: 12px 22px; border: none; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; transition: .2s; }
  .btn-preview { background: linear-gradient(135deg, #ff7eb3, #d63384); color: #fff; box-shadow: 0 4px 14px rgba(214,51,132,.35); flex: 1; }
  .btn-print { background: #fff; color: #d63384; border: 2px solid #ff65a3; }

  .plain-text { font-size: 13px; font-weight: 700; color: #7a2c4e; }
  td .plain-text { display: block; text-align: center; }

  .preview-overlay {
    display: none; position: fixed; inset: 0; background: rgba(60, 10, 35, .82);
    z-index: 999; overflow-y: auto; padding: 16px;
  }
  .preview-overlay.active { display: block; }
  .preview-box { max-width: 430px; margin: 10px auto; background: #fff; border-radius: 22px; overflow: hidden; }
  .preview-toolbar { max-width: 430px; margin: 0 auto 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  @media print {
    body { background: #fff; padding: 0; }
    .no-print, .preview-overlay { display: none !important; }
    .invoice { box-shadow: none; max-width: 100%; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="invoice" id="invoice">
    <!-- العلامة المائية باللوجو -->
    <div class="watermark">
      <img src="https://i.postimg.cc/PJX71Njr/IMG-20260829-WA0084.jpg" alt="">
    </div>

    <div class="header">
      <span class="sparkle" style="top:18px;left:26px">✦</span>
      <span class="sparkle" style="top:40px;right:36px;font-size:12px">✧</span>
      <span class="sparkle" style="bottom:24px;left:60px;font-size:11px">✦</span>
      <img class="logo" src="https://i.postimg.cc/PJX71Njr/IMG-20260829-WA0084.jpg" alt="Loudy Store Logo">
      <h1>✨ Loudy Store ✨</h1>
      <p>💖 فاتورة مبيعات 💖</p>
    </div>

    <div class="section">
      <div class="section-title">🌸 بيانات العميل</div>
      <div class="field">
        <label>اسم العميل</label>
        <input type="text" id="clientName" placeholder="اكتب اسم العميل">
      </div>
      <div class="field">
        <label>رقم التليفون</label>
        <input type="text" id="clientPhone" placeholder="01xxxxxxxxx">
      </div>
      <div class="field">
        <label>التاريخ</label>
        <input type="date" id="invoiceDate">
      </div>
    </div>

    <div class="section">
      <div class="section-title">🛍️ المنتجات</div>
      <table>
        <thead>
          <tr>
            <th style="width:36%">المنتج</th>
            <th style="width:18%">الكمية</th>
            <th style="width:20%">السعر</th>
            <th style="width:22%">الإجمالي</th>
            <th class="no-print" style="width:34px"></th>
          </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
      <button class="add-btn no-print" onclick="addItem()">➕ إضافة صنف جديد</button>
    </div>

    <div class="summary">
      <div class="summary-row">
        <span>إجمالي المنتجات</span>
        <span id="subTotal">0 ج.م</span>
      </div>
      <div class="summary-row">
        <span>التوصيل 🚚</span>
        <span>
          <input type="number" class="fee" id="deliveryFee" value="0" min="0" step="0.5" oninput="calcTotal()"> ج.م
        </span>
      </div>
      <div class="summary-row grand">
        <span>الإجمالي الكلي 💖</span>
        <span id="grandTotal">0 ج.م</span>
      </div>
      <div class="summary-row paid">
        <span>المدفوع ✅</span>
        <span>
          <input type="number" class="fee paid-in" id="paidAmount" value="0" min="0" step="0.5" oninput="calcTotal()"> ج.م
        </span>
      </div>
      <div class="summary-row remaining">
        <span>المتبقي 💳</span>
        <span id="remaining">0 ج.م</span>
      </div>
    </div>

    <div class="thanks">
      <div class="line"></div>
      <p>شكراً لثقتكم فينا ❤️<br><span>Loudy Store</span> بتتمنى لكم يوم سعيد!</p>
    </div>
  </div>

  <div class="actions no-print">
    <button class="btn btn-preview" onclick="openPreview()">👁️ معاينة الفاتورة</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ طباعة</button>
  </div>
</div>

<!-- شاشة المعاينة -->
<div class="preview-overlay" id="previewOverlay">
  <div class="preview-toolbar no-print">
    <button class="btn btn-preview" onclick="downloadImage()">📥 تحميل كصورة</button>
    <button class="btn btn-print" onclick="printPreview()">🖨️ طباعة</button>
    <button class="btn btn-print" onclick="closePreview()">✖ إغلاق</button>
  </div>
  <div class="preview-box" id="previewBox"></div>
</div>

<script>
  const LOGO_URL = 'https://i.postimg.cc/PJX71Njr/IMG-20260829-WA0084.jpg';
  document.getElementById('invoiceDate').valueAsDate = new Date();

  function addItem() {
    const tbody = document.getElementById('itemsBody');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" placeholder="اسم المنتج" class="p-name"></td>
      <td><input type="number" placeholder="0" min="0" class="p-qty" oninput="calcTotal()"></td>
      <td><input type="number" placeholder="0" min="0" step="0.5" class="p-price" oninput="calcTotal()"></td>
      <td class="item-total p-total">0 ج.م</td>
      <td class="no-print"><button class="del-btn" onclick="this.closest('tr').remove(); calcTotal();">🗑️</button></td>
    `;
    tbody.appendChild(tr);
  }

  function calcTotal() {
    let subTotal = 0;
    document.querySelectorAll('#itemsBody tr').forEach(tr => {
      const qty = parseFloat(tr.querySelector('.p-qty').value) || 0;
      const price = parseFloat(tr.querySelector('.p-price').value) || 0;
      const rowTotal = qty * price;
      tr.querySelector('.p-total').textContent = rowTotal.toFixed(2) + ' ج.م';
      subTotal += rowTotal;
    });
    const delivery = parseFloat(document.getElementById('deliveryFee').value) || 0;
    const grandTotal = subTotal + delivery;
    const paid = parseFloat(document.getElementById('paidAmount').value) || 0;
    const remaining = grandTotal - paid;
    document.getElementById('subTotal').textContent = subTotal.toFixed(2) + ' ج.م';
    document.getElementById('grandTotal').textContent = grandTotal.toFixed(2) + ' ج.م';
    document.getElementById('remaining').textContent = remaining.toFixed(2) + ' ج.م';
  }

  // نسخة نضيفة للمعاينة (بدون خانات وأزرار)
  function buildCleanInvoice() {
    const clone = document.getElementById('invoice').cloneNode(true);
    clone.querySelectorAll('input').forEach(inp => {
      const span = document.createElement('span');
      span.className = 'plain-text';
      span.textContent = inp.value || '—';
      inp.replaceWith(span);
    });
    clone.querySelectorAll('.no-print').forEach(el => el.remove());
    return clone;
  }

  function openPreview() {
    const box = document.getElementById('previewBox');
    box.innerHTML = '';
    box.appendChild(buildCleanInvoice());
    document.getElementById('previewOverlay').classList.add('active');
  }

  function closePreview() {
    document.getElementById('previewOverlay').classList.remove('active');
  }

  async function downloadImage() {
    if (!document.getElementById('previewOverlay').classList.contains('active')) {
      openPreview();
    }
    const previewBox = document.getElementById('previewBox');
    const canvas = await html2canvas(previewBox, {
      scale: 2.5,
      useCORS: true,
      backgroundColor: '#ffffff',
      windowWidth: 470
    });
    const clientName = document.getElementById('clientName').value.trim() || 'invoice';
    const link = document.createElement('a');
    link.download = 'LoudyStore-' + clientName + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  function printPreview() {
    const box = document.getElementById('previewBox');
    const win = window.open('', '_blank');
    win.document.write('<html dir="rtl" lang="ar"><head><title>فاتورة Loudy Store</title>');
    win.document.write('<style>body{font-family:Tahoma,Arial,sans-serif;margin:0;background:#fff;} ' +
      '.invoice{max-width:430px;margin:0 auto;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 0 0 1px #f9d4e3;position:relative;} ' +
      '.watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;} ' +
      '.watermark img{width:78%;max-width:320px;opacity:.06;border-radius:50%;} ' +
      '.invoice>*:not(.watermark){position:relative;z-index:1;} ' +
      '.plain-text{font-size:13px;font-weight:700;color:#7a2c4e;} td .plain-text{display:block;text-align:center;} ' +
      '.header{background:linear-gradient(160deg,#ff9ec7,#ff65a3 45%,#d63384);color:#fff;padding:16px 16px 14px;text-align:center;position:relative;overflow:hidden;} ' +
      '.header img.logo{width:64px;height:64px;object-fit:cover;border-radius:50%;border:4px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.25);} ' +
      '.header h1{font-size:21px;letter-spacing:.5px;margin-top:8px;} .header p{margin-top:3px;opacity:.95;font-size:12.5px;} ' +
      '.section{padding:10px 16px 0;} .section-title{font-size:13px;font-weight:800;color:#a8275f;margin-bottom:7px;display:flex;align-items:center;gap:6px;} ' +
      '.section-title::after{content:"";flex:1;height:1.5px;background:linear-gradient(90deg,#ffc2d9,transparent);} ' +
      '.field{margin-bottom:0;} .field label{display:block;font-size:11.5px;color:#b34a78;margin-bottom:3px;font-weight:700;} ' +
      'table{width:100%;border-collapse:separate;border-spacing:0;margin-top:4px;border-radius:12px;overflow:hidden;} ' +
      'th,td{padding:7px 4px;text-align:center;font-size:12.5px;} th{background:linear-gradient(135deg,#ff7eb3,#d63384);color:#fff;font-size:12px;} ' +
      'tr:nth-child(even) td{background:#fff3f8;} .item-total{font-weight:800;color:#d63384;white-space:nowrap;} ' +
      '.summary{background:linear-gradient(160deg,#fff3f8,#ffe4ef);margin:10px 14px;border-radius:16px;padding:10px 14px;border:1.5px solid #f8c3d9;} ' +
      '.summary-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13.5px;color:#7a2c4e;} ' +
      '.summary-row.grand{margin-top:8px;padding:10px 12px;border-radius:12px;background:linear-gradient(135deg,#ff7eb3,#d63384);color:#fff;font-size:16px;font-weight:800;} ' +
      '.summary-row.paid{font-weight:700;color:#2fbf71;} .summary-row.remaining{font-size:15px;font-weight:800;color:#e75480;} ' +
      '.thanks{text-align:center;padding:6px 16px 14px;} .thanks .line{width:60px;height:3px;border-radius:3px;background:linear-gradient(90deg,#ff9ec7,#d63384);margin:0 auto 8px;} ' +
      '.thanks p{font-size:14px;color:#b34a78;} .thanks span{font-weight:800;color:#d63384;}</style>');
    win.document.write('</head><body>');
    win.document.write(box.innerHTML);
    win.document.write('</body></html>');
    win.document.close();
    win.focus();
    setTimeout(() => { win.print(); }, 500);
  }

  addItem();
  addItem();
  calcTotal();
</script>
</body>
</html>
